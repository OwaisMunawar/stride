name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.20.0
  JAVA_VERSION: '17'

jobs:
  quality:
    name: Format, lint, types, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Tests with coverage gate
        run: npm run test:coverage -- --ci
      - name: Expo Doctor
        run: npm run doctor
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info

  ios:
    name: iOS simulator build
    needs: quality
    runs-on: macos-26
    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Prebuild native project
        run: npx expo prebuild --platform ios --no-install
      - name: Install pods
        working-directory: ios
        run: pod install
      - name: Build development build for the simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Stride.xcworkspace \
            -scheme Stride \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tail -n 80

  android:
    name: Android debug build
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - uses: gradle/actions/setup-gradle@v6.4.0
      - run: npm ci
      - name: Prebuild native project
        run: npx expo prebuild --platform android --no-install
      - name: Assemble debug APK
        working-directory: android
        # One ABI keeps CI time reasonable; release builds cover the rest.
        run: ./gradlew :app:assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a
